<!DOCTYPE html>
<html>
    <title>KONICA MINOLTA ENVIROMENT MONITOR</title>
<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<script type="module" src="https://pyscript.net/releases/2026.6.1/core.js"></script>
<style>
    body {
    font-family: Arial, sans-serif;
    font-size: 18px;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
}
    #page-title {
        font-family: 'Inter', serif;
        font-size: 48px;
        font-weight: bold;
        text-align: center;
        color: #1a3c5e;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }
    #welcome {
        font-family: 'Inter', serif;
        font-size: 24px;
        font-weight: bold;
        text-align: center;
        color: #000000;
        margin-bottom: 10px;
        letter-spacing: 1px;
    }
   

#temp-graph, #humidity-graph {
    width: 100%;
    max-width: 600px;
}
#readouts {
    display: flex;
    justify-content: center;
    gap: 40px;
    margin-top: 10px;
}

.readout-item {
    font-family: Arial, sans-serif;
    font-size: 18px;
}

#pressure-readout, #gas-readout {
    font-size: 24px;
    font-weight: bold;
    color: #1a3c5e;
}

#updated-at {
    text-align: center;
    font-size: 14px;
    color: #666;
    margin-top: 10px;
} 
#download {
    text-align: center;
    font-size: 14px;
    color: #1900fc;
    margin-top: 10px;
} 
</style>
</head>


<body>
<h1 id="page-title">KM Enviroment Manager</h1>
<h1 id="welcome">Customer: TEST</h1>

    <div id="temp-graph"></div>
    <div id="humidity-graph"></div>

<div id="readouts">
    <div class="readout-item">Pressure: <span id="pressure-readout">--</span></div>
    <div class="readout-item">Gas Resistance: <span id="gas-readout">--</span></div>
</div>
<p id="updated-at"></p>
<p id="download"><a href="/data">Download Data (CSV)</a></p>
  
  <script type="py" config="/static/config.json" src="/static/main.py"></script> 
  
</body>


</html>
